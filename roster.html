<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>传名单</title>
<style>
  :root { --bg:#0f1419; --card:#1a2332; --card2:#243044; --line:#2d3a4f; --ink:#e7ecf3; --muted:#9aa4b2; --pri:#3b82f6; --warn:#f59e0b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:860px; margin:0 auto; padding:20px 16px 64px; }
  h1 { font-size:22px; margin:0 0 8px; }
  h2 { font-size:16px; margin:0 0 8px; }
  a { color:#93c5fd; }
  .purpose { background:#142033; border:1px solid #234; border-radius:14px; padding:14px 16px; margin:12px 0; line-height:1.65; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
  .row { display:flex; flex-wrap:wrap; gap:12px; }
  .row > div { flex:1; min-width:140px; }
  input, select, textarea { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-size:14px; background:var(--card2); color:var(--ink); }
  textarea { min-height:88px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--pri); }
  .drop { display:block; border:1px dashed #3b82f6; border-radius:14px; padding:28px 16px; text-align:center; background:#121a24; cursor:pointer; }
  .drop strong { display:block; font-size:18px; margin-bottom:6px; }
  .drop input { display:none; }
  .drop .primary { margin-bottom:8px; }
  .hint { font-size:12px; color:var(--muted); margin-top:8px; line-height:1.55; }
  .money { font-size:15px; }
  .money b { color:#fff; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; align-items:center; }
  button { border:1px solid var(--line); border-radius:10px; padding:10px 16px; font-size:14px; background:var(--card2); color:var(--ink); cursor:pointer; }
  button.primary { background:var(--pri); border-color:var(--pri); color:#fff; }
  button.danger { background:#3f1d1d; border-color:#7f1d1d; color:#fecaca; }
  button:disabled { opacity:.55; cursor:not-allowed; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { border-bottom:1px solid var(--line); padding:8px 6px; text-align:left; vertical-align:middle; }
  th { color:var(--muted); }
  .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:10px; }
  td input, td select { padding:6px 8px; }
  .seq { width:42px; color:var(--muted); text-align:center; }
  tr.captain td { background:#3b3414; color:#fde68a; }
  .subgroup { border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:12px; background:#121a24; }
  .check { display:flex; align-items:center; gap:6px; }
  .check input { width:auto; }
  .toast { position:fixed; right:16px; bottom:16px; background:#111827; color:#fff; padding:12px 16px; border-radius:10px; display:none; z-index:50; max-width:360px; }
  .toast.show { display:block; }
  .toast.ok { background:#065f46; }
  .toast.err { background:#7f1d1d; }
  .hidden { display:none !important; }
  .build { font-size:11px; color:#6b7280; margin-top:18px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hint"><a href="recon.html">对账</a> 是另一页</div>
  <h1>传名单</h1>
  <div class="purpose"><b>只把还没买、也没提交过的新人发给助手买保险。</b> 签单表会一直往后加，已经有的人自动跳过。本页不下单。</div>

  <div class="card">
    <div class="drop" id="drop">
      <input id="file" type="file" accept=".xlsx,image/*" />
      <button type="button" class="primary" id="btnUpload">上传文档</button>
      <span class="hint">签单表 xlsx，或截图。上传后识别姓名、身份证、售卖金额、承包时间。</span>
    </div>
    <div class="hint" id="fileStatus"></div>
  </div>

  <div class="card">
    <label for="paste">或粘贴国内身份证</label>
    <textarea id="paste" placeholder="张三 110101199001011234&#10;李四 33010219881212567X"></textarea>
    <div class="actions">
      <button type="button" id="btnParse">识别粘贴内容</button>
      <span class="hint" id="rejectBox" style="margin:0;color:var(--warn)"></span>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div><label for="dateText">销售日期</label><input id="dateText" type="text" placeholder="11.6" autocomplete="off" /></div>
      <div><label for="perPerson">售卖金额（没识别到时填）</label><input id="perPerson" type="text" inputmode="decimal" placeholder="80" autocomplete="off" /></div>
    </div>
    <div class="money" id="tableStats">还没有客人。</div>
    <div class="hint">同一身份证、同一承保起止，已经提交或已买的会跳过。表里没写承包时间时，才再用销售日期区分，并从次日起保 3 天。金额为 0 的是队长赠送，不算进总金额。</div>
    <div id="groups"></div>
  </div>

  <div class="card">
    <h2>护照 / 港澳台 / 外籍</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th class="seq">序号</th><th>姓名</th><th>证件类型</th><th>证件号码</th><th>性别</th><th>出生日期</th><th></th></tr></thead>
        <tbody>
          <tr>
            <td class="seq" id="mSeq">1</td>
            <td><input id="mName" type="text" autocomplete="off" /></td>
            <td><select id="mType"><option>护照</option><option>港澳回乡证</option><option>台胞证</option><option>外国人永久居留证</option><option>其他</option></select></td>
            <td><input id="mId" type="text" autocomplete="off" /></td>
            <td><select id="mGender"><option value=""></option><option>男</option><option>女</option></select></td>
            <td><input id="mBirth" type="date" /></td>
            <td><button type="button" id="btnManual">添加</button></td>
          </tr>
        </tbody>
      </table>
    </div>
    <div id="manuals"></div>
  </div>

  <div class="actions">
    <button class="primary" id="btnSubmit" type="button">提交名单</button>
    <button type="button" id="btnDraft">保存草稿名单</button>
  </div>
  <div class="card hidden" id="success"></div>
  <div class="build">传名单 · 2026-11-07</div>
</div>
<div class="toast" id="toast"></div>
<script src="roster-math.js?v=20261107d"></script>
<script>
(function () {
  var WORKER = "https://tourism-kb-id-ocr.qinfan079325.workers.dev";
  var M = window.RosterMath;
  var groups = [];
  var manuals = [];
  function $(id) { return document.getElementById(id); }
  function toast(msg, kind) {
    var el = $("toast");
    el.textContent = msg;
    el.className = "toast show" + (kind ? " " + kind : "");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.className = "toast"; }, 4800);
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function workerBase() {
    try { var h = location.hostname || ""; if (h === "maozi.io" || /\.maozi\.io$/i.test(h)) return ""; } catch (e) {}
    return WORKER;
  }
  var ERRORS = {
    date_required: "请填写销售日期",
    per_person_required: "请填写售卖金额",
    guests_required: "没有可提交的客人",
    cover_invalid: "承包时间没识别出来",
    manual_guest_incomplete: "护照等客人要填性别和出生日期",
    origin_not_allowed: "这个网址还不能提交"
  };
  function defaults() { return { per_person: $("perPerson").value.trim() }; }
  function effective(group) {
    var copy = M.withDefaults(group, defaults());
    copy.cover_label = group.cover_label || "";
    return copy;
  }
  function coverOf(group) {
    return M.parseCoverSpan(group.cover_label || "", group.batch_date || $("dateText").value, new Date());
  }
  function coverText(group) {
    var c = coverOf(group);
    if (!c.ok) return group.cover_label || "按销售日期次日起保 3 天";
    return (group.cover_label ? group.cover_label + " · " : "") + c.cover_start + " 至 " + c.cover_end;
  }
  function renderStats() {
    var guests = 0, gifts = 0, billable = 0, cents = 0;
    groups.map(effective).concat(manuals.length ? [effective({ per_person: "", guests: manuals, cover_label: groups[0] && groups[0].cover_label })] : []).map(M.summarizeGroup).forEach(function (s) {
      guests += s.guest_count; gifts += s.gift_headcount; billable += s.billable_headcount;
      if (s.per_person !== "") cents += M.toCents(s.total_amount) || 0;
    });
    $("tableStats").innerHTML = guests ? ("识别 <b>" + guests + "</b> 人 · 队长 <b>" + gifts + "</b> · 总金额 <b>" + esc(M.fromCents(cents)) + "</b>") : "还没有客人。";
  }
  function renderGroups() {
    var host = $("groups");
    host.innerHTML = "";
    groups.forEach(function (group, gi) {
      var eff = effective(group);
      var sum = M.summarizeGroup(eff);
      var sec = document.createElement("section");
      sec.className = "subgroup";
      sec.dataset.gi = String(gi);
      sec.innerHTML = "<div class=\"money\">售卖金额 <b>" + esc(sum.per_person || "—") + "</b> · 承保 " + esc(coverText(eff)) + " · " + sum.guest_count + " 人</div>" +
        '<div class="table-wrap" style="margin-top:8px"><table><thead><tr><th class="seq">序号</th><th>姓名</th><th>身份证号码</th><th>队长</th><th></th></tr></thead><tbody>' +
        sum.guests.map(function (g, i) {
          var locked = M.toCents(eff.per_person) === 0;
          return '<tr class="' + (g.is_gift ? "captain" : "") + '" data-i="' + i + '"><td class="seq">' + (i + 1) + "</td><td>" + esc(g.name) + "</td><td>" + esc(g.id_no) + '</td><td class="check"><label><input data-field="captain" type="checkbox" ' + (g.is_gift ? "checked " : "") + (locked ? "disabled" : "") + "> 赠送</label></td><td><button type=\"button\" data-del=\"1\">删除</button></td></tr>";
        }).join("") + "</tbody></table></div>";
      host.appendChild(sec);
    });
    renderStats();
  }
  function applyParsed(parsed) {
    var n = parsed.groups.reduce(function (k, g) { return k + g.guests.length; }, 0);
    if (!n) { toast("没有识别到姓名和身份证", "err"); return; }
    if (parsed.dateHint && !$("dateText").value.trim()) $("dateText").value = parsed.dateHint;
    var priced = parsed.groups.filter(function (g) { return String(g.per_person || "").trim() !== ""; });
    if (priced.length === 1 && !$("perPerson").value.trim()) $("perPerson").value = priced[0].per_person;
    groups = parsed.groups;
    renderGroups();
    toast("识别到 " + n + " 人", "ok");
  }
  $("groups").addEventListener("change", function (e) {
    if (e.target.getAttribute("data-field") !== "captain") return;
    var tr = e.target.closest("tr");
    var g = groups[Number(e.target.closest("[data-gi]").dataset.gi)].guests[Number(tr.dataset.i)];
    g.captain_manual = true; g.is_captain = g.is_gift = !!e.target.checked;
    tr.classList.toggle("captain", g.is_gift);
    renderStats();
  });
  $("groups").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-del]");
    if (!btn) return;
    var tr = btn.closest("tr");
    groups[Number(btn.closest("[data-gi]").dataset.gi)].guests.splice(Number(tr.dataset.i), 1);
    groups = groups.filter(function (g) { return g.guests.length; });
    renderGroups();
  });
  $("btnParse").onclick = function () {
    var parsed = M.fuzzyRosterText($("paste").value);
    var box = $("rejectBox");
    box.textContent = parsed.rejects.length ? (parsed.rejects.length + " 行不是大陆身份证，请用手填。") : "";
    applyParsed(parsed);
  };
  $("dateText").addEventListener("input", renderGroups);
  $("perPerson").addEventListener("input", renderGroups);
  function resetForm() {
    groups = []; manuals = [];
    $("dateText").value = ""; $("perPerson").value = ""; $("paste").value = "";
    $("fileStatus").textContent = ""; $("rejectBox").textContent = "";
    renderGroups(); renderManuals();
  }
  function renderManuals() {
    $("mSeq").textContent = String(manuals.length + 1);
    var host = $("manuals");
    if (!manuals.length) { host.innerHTML = ""; renderStats(); return; }
    host.innerHTML = '<div class="table-wrap" style="margin-top:10px"><table><thead><tr><th class="seq">序号</th><th>姓名</th><th>证件类型</th><th>证件号码</th><th>性别</th><th>出生日期</th><th></th></tr></thead><tbody>' +
      manuals.map(function (g, i) {
        return '<tr data-mi="' + i + '"><td class="seq">' + (i + 1) + "</td><td>" + esc(g.name) + "</td><td>" + esc(g.id_type) + "</td><td>" + esc(g.id_no) + "</td><td>" + esc(g.gender) + "</td><td>" + esc(g.birth) + '</td><td><button type="button" data-mdel="1">删除</button></td></tr>';
      }).join("") + "</tbody></table></div>";
    renderStats();
  }
  $("manuals").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-mdel]");
    if (!btn) return;
    manuals.splice(Number(btn.closest("[data-mi]").dataset.mi), 1);
    renderManuals();
  });
  $("btnManual").onclick = function () {
    var name = $("mName").value.trim();
    var idNo = $("mId").value.replace(/\s+/g, "").trim().toUpperCase();
    var gender = $("mGender").value;
    var birth = $("mBirth").value;
    if (!name || !idNo || !gender || !birth) { toast("请填姓名、证件号码、性别、出生日期", "err"); return; }
    manuals.push({ name: name, id_no: idNo, id_type: $("mType").value, gender: gender, birth: birth, is_captain: false, is_gift: false, warn: "" });
    $("mName").value = ""; $("mId").value = ""; $("mGender").value = ""; $("mBirth").value = "";
    renderManuals();
  };

  async function readZip(buf) {
    var view = new DataView(buf);
    var bytes = new Uint8Array(buf);
    var files = {};
    var o = 0;
    while (o + 30 < bytes.length && view.getUint32(o, true) === 0x04034b50) {
      var method = view.getUint16(o + 8, true);
      var compSize = view.getUint32(o + 18, true);
      var nameLen = view.getUint16(o + 26, true);
      var extraLen = view.getUint16(o + 28, true);
      var name = new TextDecoder().decode(bytes.subarray(o + 30, o + 30 + nameLen));
      var start = o + 30 + nameLen + extraLen;
      var data = bytes.subarray(start, start + compSize);
      if (method === 8) {
        var out = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
        files[name] = await new Response(out).text();
      } else if (method === 0) files[name] = new TextDecoder().decode(data);
      o = start + compSize;
    }
    return files;
  }
  function xmlText(node) {
    var out = "";
    var nodes = node.getElementsByTagName("t");
    for (var i = 0; i < nodes.length; i++) out += nodes[i].textContent || "";
    return out;
  }
  async function rowsFromXlsx(buf) {
    var files = await readZip(buf);
    var doc = new DOMParser();
    var ss = [];
    if (files["xl/sharedStrings.xml"]) {
      var sst = doc.parseFromString(files["xl/sharedStrings.xml"], "text/xml").getElementsByTagName("si");
      for (var i = 0; i < sst.length; i++) ss.push(xmlText(sst[i]));
    }
    var sheetName = Object.keys(files).filter(function (n) { return /^xl\/worksheets\/sheet\d+\.xml$/.test(n); }).sort()[0];
    var sheet = doc.parseFromString(files[sheetName], "text/xml");
    var xrows = sheet.getElementsByTagName("row");
    var rows = [];
    for (var r = 0; r < xrows.length; r++) {
      var cells = [];
      var cs = xrows[r].getElementsByTagName("c");
      for (var c = 0; c < cs.length; c++) {
        var ref = cs[c].getAttribute("r") || "";
        var col = 0;
        for (var k = 0; k < ref.length && ref.charAt(k) >= "A" && ref.charAt(k) <= "Z"; k++) col = col * 26 + (ref.charCodeAt(k) - 64);
        var text = "";
        if (cs[c].getAttribute("t") === "s") text = ss[Number((cs[c].getElementsByTagName("v")[0] || {}).textContent || 0)] || "";
        else if (cs[c].getElementsByTagName("is")[0]) text = xmlText(cs[c]);
        else text = (cs[c].getElementsByTagName("v")[0] || {}).textContent || "";
        cells[col - 1] = text;
      }
      for (var n = 0; n < cells.length; n++) if (cells[n] == null) cells[n] = "";
      rows.push({ cells: cells });
    }
    return rows;
  }
  function loadTesseract() {
    if (window.Tesseract) return Promise.resolve(window.Tesseract);
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
      s.onload = function () { window.Tesseract ? resolve(window.Tesseract) : reject(new Error("识别组件没载入")); };
      s.onerror = function () { reject(new Error("识别组件下载失败")); };
      document.head.appendChild(s);
    });
  }
  $("file").addEventListener("change", async function () {
    var file = $("file").files && $("file").files[0];
    if (!file) return;
    $("fileStatus").textContent = "正在识别 " + file.name + " …";
    try {
      if (/\.xlsx$/i.test(file.name)) {
        var rows = await rowsFromXlsx(await file.arrayBuffer());
        applyParsed(M.groupsFromCells(rows));
        $("fileStatus").textContent = "已读取 " + file.name;
      } else if (/^image\//.test(file.type)) {
        var Tesseract = await loadTesseract();
        var result = await Tesseract.recognize(file, "chi_sim+eng");
        applyParsed(M.fuzzyRosterText((result && result.data && result.data.text) || ""));
        $("fileStatus").textContent = "已识别截图";
      } else toast("请上传 xlsx 或图片", "err");
    } catch (err) {
      $("fileStatus").textContent = "";
      toast("没读出来，可以改用粘贴", "err");
    }
    $("file").value = "";
  });

  function skipSentence(reports) {
    var n = 0;
    var names = [];
    var why = {};
    var label = { already_submitted: "已经提交", already_purchased: "已买", already_draft: "已经存过草稿", duplicate_in_file: "这张表里重复" };
    reports.forEach(function (d) {
      n += d.skipped_count || 0;
      (d.skipped || []).forEach(function (s) {
        if (s.name && names.length < 8 && names.indexOf(s.name) < 0) names.push(s.name);
        if (s.reason) why[s.reason] = true;
      });
    });
    if (!n) return "";
    var bits = Object.keys(label).filter(function (k) { return why[k]; }).map(function (k) { return label[k]; });
    return "跳过 " + n + " 人（" + (bits.join("、") || "已经有了") + "）" + (names.length ? "：" + names.join("、") : "") + "。";
  }
  async function sendLists(asDraft) {
    var list = groups.map(effective);
    if (manuals.length) list.push(effective({ per_person: "", guests: manuals, cover_label: (groups[0] && groups[0].cover_label) || "", batch_date: (groups[0] && groups[0].batch_date) || "" }));
    var sums = list.map(M.summarizeGroup).filter(function (s) { return s.guest_count; });
    if (!sums.length) { toast("请先上传表格或粘贴名单", "err"); return; }
    var btn = asDraft ? $("btnDraft") : $("btnSubmit");
    btn.disabled = true;
    var reports = [];
    try {
      for (var i = 0; i < sums.length; i++) {
        var src = list[i];
        var s = sums[i];
        if (s.per_person === "") { toast("有一组没有售卖金额", "err"); return; }
        var date = M.parseBatchDate(src.batch_date || $("dateText").value, new Date());
        if (!date.ok) { toast("请填写销售日期，例如 11.6", "err"); return; }
        var cover = M.parseCoverSpan(src.cover_label || "", src.batch_date || date.batch_date, new Date());
        if (!cover.ok) { toast("承包时间没识别出来", "err"); return; }
        var res = await fetch(workerBase() + "/roster", {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({
            date: date.batch_date, date_iso: date.date_iso,
            cover_start: cover.cover_start, cover_end: cover.cover_end, cover_days: cover.cover_days,
            per_person: s.per_person, guests: s.guests, account: "传名单", draft: !!asDraft
          })
        });
        var data = await res.json().catch(function () { return {}; });
        if (!data.ok) { toast(ERRORS[data.error] || "没有保存", "err"); return; }
        if (data.new_count == null && data.record) data.new_count = data.record.guest_count;
        reports.push(data);
      }
      var fresh = reports.reduce(function (n, d) { return n + (d.new_count || 0); }, 0);
      var saved = reports.filter(function (d) { return d.record; }).map(function (d) { return d.record; });
      var skippedText = skipSentence(reports);
      var box = $("success");
      box.classList.remove("hidden");
      if (asDraft) {
        box.innerHTML = "<h2>草稿名单已保存</h2><p class=\"hint\">新保存 " + fresh + " 人。" + esc(skippedText) + "没有发给助手。</p>";
        toast(fresh ? "草稿已保存 " + fresh + " 人" : "没有新人，草稿没有重复保存", fresh ? "ok" : "");
        return;
      }
      var delivered = saved.filter(function (r) { return r.delivered; }).length;
      var notice = !fresh ? "没有新人。" : (saved.length && delivered === saved.length ? "新人已发给助手买保险。本页没有下单。" : "新人已保存，但通知没有成功。");
      box.innerHTML = "<h2>" + (fresh ? "名单已提交" : "没有要提交的新人") + "</h2><p class=\"hint\">新提交 " + fresh + " 人。" + esc(skippedText) + notice + "</p>" +
        saved.map(function (rec) {
          return "<div class=\"subgroup\"><b>售卖金额 " + esc(rec.per_person) + " · 总金额 " + esc(rec.total_amount) + "</b><div class=\"hint\">承保 " + esc(rec.cover_start) + " 至 " + esc(rec.cover_end) + " · " + rec.guest_count + " 人 · 队长 " + rec.gift_headcount + "</div><pre class=\"hint\">" + esc((rec.guests || []).map(function (g) { return g.name + " " + g.id_no + (g.is_gift ? " 队长赠送" : ""); }).join("\n")) + "</pre></div>";
        }).join("");
      if (fresh) resetForm();
      box.classList.remove("hidden");
      toast(fresh ? (delivered ? "新提交 " + fresh + " 人" : "已保存，通知未成功") : "没有新人", fresh && delivered ? "ok" : (fresh ? "err" : ""));
    } catch (e) {
      toast("网络异常", "err");
    } finally { btn.disabled = false; }
  }
  $("btnUpload").onclick = function (e) {
    e.preventDefault();
    e.stopPropagation();
    $("file").click();
  };
  $("drop").onclick = function (e) {
    if (e.target.closest("#btnUpload")) return;
    $("file").click();
  };
  $("btnSubmit").onclick = function () { sendLists(false); };
  $("btnDraft").onclick = function () { sendLists(true); };
  renderStats();
})();
</script>
</body>
</html>
